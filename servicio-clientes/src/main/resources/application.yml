server:
  port: 8081

spring:
  application:
    name: servicio-clientes
  datasource:
    url: jdbc:postgresql://localhost:5432/clientes_db
    username: postgres
    password: postgres
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration

statsig:
  server-key: ${STATSIG_SERVER_KEY}

servicios:
  pedidos:
    url: ${SERVICIO_PEDIDOS_URL:http://localhost:8083}

# Observabilidad: se traza el 100% de las requests (en produccion suele ser un porcentaje menor)
management:
  tracing:
    sampling:
      probability: 1.0
  endpoints:
    web:
      exposure:
        include: health,info
